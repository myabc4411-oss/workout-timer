<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Workout Timer PRO</title>
<script>
// === AUTO-UPDATE CHECK ===
// 홈 화면에 설치된 상태로 오래 켜두면 브라우저가 예전 버전을 그대로 보여줄 수 있어서,
// 매번 켤 때(그리고 다시 포그라운드로 돌아올 때)마다 GitHub에 올라간 최신 버전인지 확인하고,
// 다르면 캐시를 건너뛰고 새 버전을 강제로 불러옵니다.
(function () {
  var APP_BUILD = '20260813-2'; // 이 페이지 자체의 빌드 번호. 배포할 때마다 version.json과 함께 올립니다.

  function checkForUpdate() {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.build && data.build !== APP_BUILD) {
          var url = new URL(location.href);
          url.searchParams.set('v', data.build);
          location.replace(url.toString());
        }
      })
      .catch(function () { /* 오프라인이거나 확인 실패 시 그냥 지금 버전 계속 사용 */ });
  }

  checkForUpdate();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkForUpdate();
  });
})();
</script>
<meta name="description" content="세트/휴식/스트레칭 인터벌 운동 타이머 + 세트별 기록">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="타이머PRO">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overscroll-behavior-y: none;
  }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #00e5a0;
    --accent2: #ffcc00;
    --accent-rest: #4dabf7;
    --accent-stretch: #ff6b6b;
    --text: #f0f0f0;
    --text-muted: #888;
    --text-dim: #555;
    --danger: #ff4757;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 calc(40px + env(safe-area-inset-bottom));
    overscroll-behavior-y: none;
    -webkit-tap-highlight-color: transparent;
  }

  button, .routine-slot, .slot-delete {
    touch-action: manipulation;
  }

  /* iOS: keep inputs at 16px+ so focusing a field doesn't auto-zoom the page */
  input, textarea, select {
    font-size: 16px !important;
  }

  /* hide number spinner arrows for a cleaner touch UI */
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] { -moz-appearance: textfield; }

  /* HEADER */
  header {
    width: 100%;
    background: linear-gradient(135deg, #111 0%, #0a0a0a 100%);
    border-bottom: 1px solid var(--border);
    padding: calc(16px + env(safe-area-inset-top)) 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--text);
  }

  header h1 span {
    color: var(--accent);
  }

  /* MAIN CONTAINER */
  .container {
    width: 100%;
    max-width: 480px;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
  }

  .card-title {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* FORM FIELDS */
  .field-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    font-weight: 500;
  }

  .field input[type="text"],
  .field input[type="number"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .field input:focus {
    border-color: var(--accent);
  }

  .field.full { grid-column: 1 / -1; }

  /* ROUTINE NAME */
  .routine-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
    padding: 4px 0;
  }

  /* PHASE INDICATOR */
  .phase-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
  }

  .phase-seg {
    height: 4px;
    border-radius: 2px;
    flex: 1;
    background: var(--border);
    transition: background 0.3s;
  }

  .phase-seg.warmup { --c: var(--accent); }
  .phase-seg.exercise { --c: var(--accent2); }
  .phase-seg.rest { --c: var(--accent-rest); }
  .phase-seg.stretch { --c: var(--accent-stretch); }
  .phase-seg.active { background: var(--c); }

  /* PHASE LABEL */
  .phase-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    margin-bottom: 4px;
    transition: color 0.3s;
  }

  .phase-warmup { color: var(--accent); }
  .phase-exercise { color: var(--accent2); }
  .phase-rest { color: var(--accent-rest); }
  .phase-stretch { color: var(--accent-stretch); }
  .phase-done { color: var(--text-muted); }

  /* TIMER DISPLAY */
  .timer-wrap {
    text-align: center;
    padding: 8px 0;
    position: relative;
  }

  .timer-display {
    font-family: 'Roboto Mono', monospace;
    font-size: clamp(52px, 16vw, 80px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -2px;
    transition: color 0.3s;
  }

  .timer-warmup { color: var(--accent); }
  .timer-exercise { color: var(--accent2); }
  .timer-rest { color: var(--accent-rest); }
  .timer-stretch { color: var(--accent-stretch); }
  .timer-done { color: var(--text-muted); }

  .timer-glow {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  /* SET INFO */
  .set-info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }

  .set-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .set-progress {
    width: 120px;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .set-progress-fill {
    height: 100%;
    background: var(--accent2);
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  /* NEXT PHASE */
  .next-phase {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 6px;
  }

  /* CONTROLS */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn {
    border-radius: 10px;
    border: none;
    padding: 12px;
    min-height: 48px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }

  .btn-primary:hover { background: #00d490; }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { background: #252525; border-color: #444; }

  .btn-danger {
    background: rgba(255, 71, 87, 0.15);
    color: var(--danger);
    border: 1px solid rgba(255, 71, 87, 0.3);
  }

  .btn-danger:hover { background: rgba(255, 71, 87, 0.25); }

  .btn-accent2 {
    background: var(--accent2);
    color: #000;
  }

  .btn-accent2:hover { background: #f0c000; }

  .btn.full { grid-column: 1 / -1; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ROUTINE SLOTS */
  .routine-slots {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .routine-slot {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .routine-slot:hover { border-color: var(--accent); }

  .slot-name {
    font-size: 13px;
    font-weight: 500;
    flex: 1;
  }

  .slot-meta {
    font-size: 11px;
    color: var(--text-muted);
  }

  .slot-delete {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    padding: 10px;
    margin: -10px;
    line-height: 1;
    transition: color 0.2s;
  }

  .slot-delete:hover { color: var(--danger); }

  .empty-msg {
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    padding: 12px;
  }

  /* TOTAL TIME */
  .total-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .total-info span { color: var(--text); font-weight: 500; }

  /* COMPLETION */
  .completion-card {
    text-align: center;
    padding: 30px 20px;
  }

  .completion-emoji { font-size: 48px; margin-bottom: 12px; }
  .completion-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .completion-sub { font-size: 14px; color: var(--text-muted); }

  /* PULSE ANIMATION */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .pulsing { animation: pulse 1s ease-in-out infinite; }

  /* SET LOG CARD */
  .log-card {
    display: none;
    border-color: var(--accent2);
    animation: logIn 0.25s ease;
  }
  .log-card.show { display: block; }

  @keyframes logIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .log-card .card-title {
    color: var(--accent2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .log-field-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .log-field-group .field.full { grid-column: 1 / -1; }

  /* PER-EXERCISE LOG ROWS */
  .log-exercise-rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }

  .log-exercise-row {
    display: grid;
    grid-template-columns: 1fr 80px 80px;
    align-items: center;
    gap: 8px;
  }

  .log-exercise-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .log-exercise-row input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Roboto Mono', monospace;
    padding: 8px 8px;
    outline: none;
    text-align: center;
    width: 100%;
  }

  .log-exercise-row input:focus { border-color: var(--accent2); }

  .log-exercise-header {
    display: grid;
    grid-template-columns: 1fr 80px 80px;
    gap: 8px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 0 0 2px;
  }
  .log-exercise-header span:not(:first-child) { text-align: center; }

  .field textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    resize: none;
    min-height: 44px;
    transition: border-color 0.2s;
    width: 100%;
  }

  .field textarea:focus { border-color: var(--accent2); }

  .log-saved-hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* SET LOG SUMMARY */
  .log-summary {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
    text-align: left;
  }

  .log-summary-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .log-summary-set {
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    color: var(--accent2);
    font-size: 13px;
    flex-shrink: 0;
    min-width: 34px;
  }

  .log-summary-body { flex: 1; min-width: 0; }

  .log-summary-stats {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  .log-summary-memo {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .log-summary-empty {
    font-size: 12px;
    color: var(--text-dim);
  }

  /* SECTION DIVIDER */
  .section-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 4px 0;
  }
  .section-divider::before, .section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
</style>
</head>
<body>

<header>
  <div class="logo-icon">💪</div>
  <h1>Workout Timer <span>PRO</span></h1>
</header>

<div class="container">

  <!-- ROUTINE SETTINGS -->
  <div class="card" id="settings-card">
    <div class="card-title">루틴 설정</div>
    <div class="field-group">
      <div class="field full">
        <label>루틴 이름</label>
        <input type="text" id="routineName" value="풀업 딥스 푸쉬업 스쿼트" placeholder="루틴 이름 입력" autocomplete="off" enterkeyhint="done">
      </div>
      <div class="field full">
        <label>운동 종목 (쉼표로 구분)</label>
        <input type="text" id="exerciseList" value="풀업, 딥스, 푸쉬업, 스쿼트" placeholder="풀업, 딥스, 푸쉬업, 스쿼트" autocomplete="off" enterkeyhint="done">
      </div>
      <div class="field">
        <label>준비운동 (초)</label>
        <input type="number" id="warmup" value="10" min="0" inputmode="numeric">
      </div>
      <div class="field">
        <label>운동 시간 (초)</label>
        <input type="number" id="exercise" value="90" min="1" inputmode="numeric">
      </div>
      <div class="field">
        <label>휴식 시간 (초)</label>
        <input type="number" id="rest" value="120" min="0" inputmode="numeric">
      </div>
      <div class="field">
        <label>세트 수</label>
        <input type="number" id="sets" value="10" min="1" max="99" inputmode="numeric">
      </div>
      <div class="field full">
        <label>스트레칭 (초)</label>
        <input type="number" id="stretch" value="300" min="0" inputmode="numeric">
      </div>
    </div>

    <div class="total-info" id="totalInfo">
      <span>총 예상 시간</span>
      <span id="totalTime">--</span>
    </div>
  </div>

  <!-- TIMER DISPLAY -->
  <div class="card" id="timer-card">
    <div class="phase-bar">
      <div class="phase-seg warmup" id="seg-warmup"></div>
      <div class="phase-seg exercise" id="seg-exercise"></div>
      <div class="phase-seg rest" id="seg-rest"></div>
      <div class="phase-seg stretch" id="seg-stretch"></div>
    </div>

    <div class="phase-label phase-exercise" id="phaseLabel">운동 준비</div>

    <div class="timer-wrap">
      <div class="timer-display timer-exercise" id="timerDisplay">00:00</div>
    </div>

    <div class="set-info" id="setInfo">
      <div class="set-badge" id="setBadge">대기 중</div>
      <div class="set-progress">
        <div class="set-progress-fill" id="setProgressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="next-phase" id="nextPhase">시작 버튼을 눌러 운동을 시작하세요</div>

    <div class="log-summary" id="logSummary" style="display:none"></div>
  </div>

  <!-- SET LOG (기록) -->
  <div class="card log-card" id="log-card">
    <div class="card-title"><span id="logCardTitle">세트 기록</span><span class="log-saved-hint">자동 저장됨</span></div>
    <div id="logExerciseRows" class="log-exercise-rows"></div>
    <div class="log-field-group">
      <div class="field full">
        <label>세트 메모</label>
        <textarea id="logMemo" placeholder="컨디션, 통증, 특이사항 등을 자유롭게 남겨보세요" oninput="saveCurrentLog()"></textarea>
      </div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="btn btn-primary" id="btnStart" onclick="startTimer()">▶ 시작</button>
    <button class="btn btn-secondary" id="btnPause" onclick="pauseTimer()" disabled>⏸ 일시정지</button>
    <button class="btn btn-secondary" id="btnResume" onclick="resumeTimer()" disabled>▶ 재시작</button>
    <button class="btn btn-danger" id="btnStop" onclick="stopTimer()" disabled>■ 정지</button>
  </div>

  <button class="btn btn-accent2 full" id="btnCopyLog" onclick="copyLogSummary()" style="display:none">📋 운동 기록 복사하기</button>

  <!-- SAVE / LOAD -->
  <div class="section-divider">루틴 저장 / 불러오기</div>

  <div class="controls">
    <button class="btn btn-secondary" onclick="saveRoutine()">💾 루틴 저장</button>
    <button class="btn btn-secondary" onclick="toggleRoutineList()">📂 불러오기</button>
  </div>

  <div id="routineListWrap" style="display:none">
    <div class="card" style="margin-top:0">
      <div class="card-title">저장된 루틴</div>
      <div class="routine-slots" id="routineList"></div>
    </div>
  </div>

  <!-- WORKOUT HISTORY -->
  <div class="section-divider">운동 기록 히스토리</div>

  <div class="controls">
    <button class="btn btn-secondary full" onclick="toggleHistoryList()">📖 지난 기록 보기</button>
  </div>

  <div id="historyListWrap" style="display:none">
    <div class="card" style="margin-top:0">
      <div class="card-title">이 기기에 저장된 기록</div>
      <div class="field-group" style="margin-bottom:10px">
        <div class="field">
          <label>날짜로 찾기</label>
          <input type="date" id="historyDateFilter" oninput="onHistoryDateFilterChange()">
        </div>
        <div class="field" style="justify-content:flex-end">
          <label>&nbsp;</label>
          <button class="btn btn-secondary" onclick="clearHistoryDateFilter()">전체 보기</button>
        </div>
      </div>
      <div id="historyCount" class="log-saved-hint" style="margin-bottom:8px"></div>
      <div class="routine-slots" id="historyList"></div>
    </div>
  </div>

</div>

<audio id="beepSound" preload="auto"></audio>

<script>
// === STATE ===
let timer = null;
let remaining = 0;
let currentPhase = null; // 'warmup' | 'exercise' | 'rest' | 'stretch' | 'done'
let currentSet = 1;
let isPaused = false;
let totalSets = 1;

// === SET LOG STATE ===
let setLogs = {}; // { [setNumber]: { weight, reps, memo } }
let currentLogSet = null;
let currentHistoryId = null;
let expandedHistoryId = null;
let historyDateFilter = null; // 'YYYY-MM-DD' (local) or null for all
const HISTORY_KEY = 'wt_history';

// === SETTINGS HELPERS ===
const getVal = id => parseInt(document.getElementById(id).value) || 0;
const getStr = id => document.getElementById(id).value.trim();

function calcTotal() {
  const w = getVal('warmup');
  const e = getVal('exercise');
  const r = getVal('rest');
  const s = getVal('sets');
  const st = getVal('stretch');
  const total = w + (e + r) * s - r + st;
  document.getElementById('totalTime').textContent = formatTime(Math.max(0, total));
}

['warmup','exercise','rest','sets','stretch'].forEach(id => {
  document.getElementById(id).addEventListener('input', calcTotal);
});

calcTotal();

// === FORMAT ===
function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

// === PHASE CONFIG ===
const phaseNames = {
  warmup: '준비운동',
  exercise: '운동',
  rest: '휴식',
  stretch: '스트레칭',
  done: '완료!'
};

function setPhaseUI(phase, timeLeft, set, totalSet) {
  const label = document.getElementById('phaseLabel');
  const display = document.getElementById('timerDisplay');
  const badge = document.getElementById('setBadge');
  const nextEl = document.getElementById('nextPhase');
  const fill = document.getElementById('setProgressFill');

  // Remove all classes
  ['warmup','exercise','rest','stretch','done'].forEach(p => {
    label.classList.remove('phase-'+p);
    display.classList.remove('timer-'+p);
  });

  label.classList.add('phase-'+phase);
  display.classList.add('timer-'+phase);
  label.textContent = phaseNames[phase] || '';
  display.textContent = formatTime(timeLeft);

  // Phase bar
  const segs = ['warmup','exercise','rest','stretch'];
  segs.forEach(s => {
    const el = document.getElementById('seg-'+s);
    el.classList.toggle('active', s === phase);
  });

  if (phase === 'done') {
    badge.textContent = '완료 🎉';
    nextEl.textContent = '수고하셨습니다!';
    fill.style.width = '100%';
  } else if (phase === 'warmup') {
    badge.textContent = '워밍업';
    nextEl.textContent = `다음: 운동 (${formatTime(getVal('exercise'))})`;
    fill.style.width = '0%';
  } else if (phase === 'exercise') {
    badge.textContent = `${set} / ${totalSet} 세트`;
    const nextPhase = set >= totalSet ? '스트레칭' : '휴식';
    const nextTime = set >= totalSet ? formatTime(getVal('stretch')) : formatTime(getVal('rest'));
    nextEl.textContent = `다음: ${nextPhase} (${nextTime})`;
    fill.style.width = `${(set / totalSet) * 100}%`;
  } else if (phase === 'rest') {
    badge.textContent = `${set} / ${totalSet} 세트 휴식`;
    nextEl.textContent = `다음: 운동 (${formatTime(getVal('exercise'))})`;
    fill.style.width = `${(set / totalSet) * 100}%`;
  } else if (phase === 'stretch') {
    badge.textContent = '스트레칭';
    nextEl.textContent = '마무리 중...';
    fill.style.width = '100%';
  }
}

// === SET LOG (종목별 기록) ===
function getExerciseList() {
  return getStr('exerciseList')
    .split(',')
    .map(s => s.trim())
    .filter(Boolean);
}

// 세트 하나에 기록된 값이 있는지(종목별 무게/횟수 중 하나라도, 또는 메모)
function setHasData(d) {
  if (!d) return false;
  if (d.memo) return true;
  const ex = d.exercises || {};
  return Object.keys(ex).some(name => ex[name].weight || ex[name].reps);
}

function exerciseStatsText(d) {
  const ex = (d && d.exercises) || {};
  return Object.keys(ex)
    .map(name => {
      const v = ex[name];
      const parts = [v.weight ? `${v.weight}kg` : '', v.reps ? `${v.reps}회` : ''].filter(Boolean).join(' ');
      return parts ? `${name} ${parts}` : '';
    })
    .filter(Boolean)
    .join(' · ');
}

function showLogCard(setNum, opts) {
  currentLogSet = setNum;
  const data = (setLogs[setNum] && setLogs[setNum].exercises) || {};
  const names = getExerciseList();
  const rowsEl = document.getElementById('logExerciseRows');

  if (names.length === 0) {
    rowsEl.innerHTML = '<div class="log-summary-empty">먼저 위 "운동 종목"에 종목을 입력해주세요 (쉼표로 구분)</div>';
  } else {
    const header = `<div class="log-exercise-header"><span>종목</span><span>무게(kg)</span><span>횟수</span></div>`;
    const rows = names.map((name, i) => {
      const v = data[name] || {};
      return `<div class="log-exercise-row" data-exercise="${escapeHtml(name)}">
        <div class="log-exercise-name">${escapeHtml(name)}</div>
        <input type="number" step="0.5" min="0" inputmode="decimal" placeholder="0" value="${v.weight ? escapeAttr(v.weight) : ''}" oninput="saveCurrentLog()">
        <input type="number" min="0" inputmode="numeric" placeholder="0" value="${v.reps ? escapeAttr(v.reps) : ''}" oninput="saveCurrentLog()">
      </div>`;
    }).join('');
    rowsEl.innerHTML = header + rows;
  }

  document.getElementById('logMemo').value = (setLogs[setNum] && setLogs[setNum].memo) || '';
  const isFinal = opts && opts.final;
  document.getElementById('logCardTitle').textContent = `${setNum}세트 기록${isFinal ? ' (마지막 세트)' : ''}`;
  document.getElementById('log-card').classList.add('show');
}

function hideLogCard() {
  currentLogSet = null;
  document.getElementById('log-card').classList.remove('show');
}

function saveCurrentLog() {
  if (currentLogSet == null) return;
  const exercises = {};
  document.querySelectorAll('#logExerciseRows .log-exercise-row').forEach(row => {
    const name = row.dataset.exercise;
    const inputs = row.querySelectorAll('input');
    const weight = (inputs[0] && inputs[0].value.trim()) || '';
    const reps = (inputs[1] && inputs[1].value.trim()) || '';
    if (weight || reps) exercises[name] = { weight, reps };
  });
  const memo = getStr('logMemo');
  const entry = { exercises, memo };
  if (!setHasData(entry)) {
    delete setLogs[currentLogSet];
  } else {
    setLogs[currentLogSet] = entry;
  }
  if (currentPhase === 'done') {
    renderLogSummary();
    updateCurrentHistoryEntry();
  }
}

function updateLogCardForPhase(item) {
  if (item.phase === 'rest') {
    showLogCard(item.set);
  } else if (item.phase === 'stretch') {
    showLogCard(totalSets, { final: true });
  } else {
    hideLogCard();
  }
}

function renderLogSummary() {
  const el = document.getElementById('logSummary');
  const rows = [];
  for (let i = 1; i <= totalSets; i++) {
    const d = setLogs[i];
    if (!setHasData(d)) continue;
    const stats = exerciseStatsText(d);
    rows.push(`<div class="log-summary-row">
      <div class="log-summary-set">${i}세트</div>
      <div class="log-summary-body">
        ${stats ? `<div class="log-summary-stats">${escapeHtml(stats)}</div>` : ''}
        ${d.memo ? `<div class="log-summary-memo">${escapeHtml(d.memo)}</div>` : ''}
      </div>
    </div>`);
  }
  if (rows.length === 0) {
    el.style.display = 'none';
    document.getElementById('btnCopyLog').style.display = 'none';
    return;
  }
  el.innerHTML = rows.join('');
  el.style.display = 'flex';
  document.getElementById('btnCopyLog').style.display = 'block';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return String(str).replace(/"/g, '&quot;');
}

function copyLogSummary() {
  const routineName = getStr('routineName') || '운동';
  const lines = [`${routineName} - 세트 기록`];
  for (let i = 1; i <= totalSets; i++) {
    const d = setLogs[i];
    if (!setHasData(d)) continue;
    const stats = exerciseStatsText(d);
    let line = `${i}세트`;
    if (stats) line += ` - ${stats}`;
    if (d.memo) line += ` (${d.memo})`;
    lines.push(line);
  }
  const text = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      alert('기록이 복사되었습니다!');
    }).catch(() => {
      alert(text);
    });
  } else {
    alert(text);
  }
}

function resetLogState() {
  setLogs = {};
  currentHistoryId = null;
  hideLogCard();
  document.getElementById('logSummary').style.display = 'none';
  document.getElementById('btnCopyLog').style.display = 'none';
}

// === WORKOUT HISTORY (이 기기에만 저장됨, localStorage) ===
function getHistoryList() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
}

function writeHistoryList(list) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
}

function hasAnyLog() {
  return Object.keys(setLogs).length > 0;
}

function createHistoryEntry(opts) {
  if (!hasAnyLog()) return; // nothing logged yet, don't clutter history
  const completed = !opts || opts.completed !== false;
  const list = getHistoryList();
  const entry = {
    id: 'h' + Date.now() + Math.random().toString(36).slice(2, 7),
    date: new Date().toISOString(),
    routineName: getStr('routineName') || '이름 없는 루틴',
    sets: totalSets,
    completed,
    logs: { ...setLogs }
  };
  list.unshift(entry);
  writeHistoryList(list);
  currentHistoryId = entry.id;
}

function updateCurrentHistoryEntry() {
  if (currentPhase !== 'done') return;
  if (currentHistoryId == null) {
    if (hasAnyLog()) createHistoryEntry();
    return;
  }
  const list = getHistoryList();
  const idx = list.findIndex(e => e.id === currentHistoryId);
  if (idx === -1) return;
  list[idx].logs = { ...setLogs };
  writeHistoryList(list);
}

function toggleHistoryList() {
  const wrap = document.getElementById('historyListWrap');
  const isHidden = wrap.style.display === 'none';
  wrap.style.display = isHidden ? 'block' : 'none';
  if (isHidden) renderHistoryList();
}

function formatHistoryDate(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const pad = n => n.toString().padStart(2, '0');
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// local YYYY-MM-DD for an ISO timestamp, so the date filter matches the user's own day boundary
function toLocalDateKey(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const pad = n => n.toString().padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function onHistoryDateFilterChange() {
  const val = document.getElementById('historyDateFilter').value;
  historyDateFilter = val || null;
  renderHistoryList();
}

function clearHistoryDateFilter() {
  historyDateFilter = null;
  document.getElementById('historyDateFilter').value = '';
  renderHistoryList();
}

function renderHistoryList() {
  const fullList = getHistoryList();
  const list = historyDateFilter
    ? fullList.filter(entry => toLocalDateKey(entry.date) === historyDateFilter)
    : fullList;
  const el = document.getElementById('historyList');
  const countEl = document.getElementById('historyCount');

  if (fullList.length === 0) {
    countEl.textContent = '';
    el.innerHTML = '<div class="empty-msg">아직 저장된 운동 기록이 없습니다</div>';
    return;
  }
  countEl.textContent = historyDateFilter
    ? `${historyDateFilter} · ${list.length}개`
    : `전체 ${fullList.length}개`;
  if (list.length === 0) {
    el.innerHTML = '<div class="empty-msg">선택한 날짜에는 기록이 없습니다</div>';
    return;
  }
  el.innerHTML = list.map(entry => {
    const loggedSets = Object.keys(entry.logs || {}).length;
    const isOpen = expandedHistoryId === entry.id;
    let detail = '';
    if (isOpen) {
      const rows = Object.keys(entry.logs || {})
        .map(Number).sort((a, b) => a - b)
        .map(setNum => {
          const d = entry.logs[setNum];
          const stats = exerciseStatsText(d);
          return `<div class="log-summary-row">
            <div class="log-summary-set">${setNum}세트</div>
            <div class="log-summary-body">
              ${stats ? `<div class="log-summary-stats">${escapeHtml(stats)}</div>` : ''}
              ${d.memo ? `<div class="log-summary-memo">${escapeHtml(d.memo)}</div>` : ''}
            </div>
          </div>`;
        }).join('');
      detail = `<div class="log-summary" style="display:flex;margin-top:8px">${rows || '<div class="log-summary-empty">기록 없음</div>'}</div>`;
    }
    return `<div>
      <div class="routine-slot" onclick="toggleHistoryDetail('${entry.id}')">
        <div class="slot-name">${escapeHtml(entry.routineName)}${entry.completed === false ? ' <span style="color:var(--danger);font-weight:400">· 중단됨</span>' : ''}</div>
        <div class="slot-meta">${formatHistoryDate(entry.date)} · ${loggedSets}/${entry.sets}세트</div>
        <button class="slot-delete" onclick="event.stopPropagation();deleteHistoryEntry('${entry.id}')">✕</button>
      </div>
      ${detail}
    </div>`;
  }).join('');
}

function toggleHistoryDetail(id) {
  expandedHistoryId = expandedHistoryId === id ? null : id;
  renderHistoryList();
}

function deleteHistoryEntry(id) {
  const list = getHistoryList().filter(e => e.id !== id);
  writeHistoryList(list);
  if (expandedHistoryId === id) expandedHistoryId = null;
  renderHistoryList();
}

// === BEEP ===
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function beep(freq = 880, dur = 0.1, vol = 0.3) {
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

function beepPhaseChange() {
  beep(660, 0.15, 0.4);
  setTimeout(() => beep(880, 0.2, 0.4), 180);
}

function beepCountdown() {
  beep(440, 0.08, 0.2);
}

function beepDone() {
  [0, 200, 400].forEach(d => setTimeout(() => beep(880, 0.15, 0.5), d));
  setTimeout(() => beep(1100, 0.4, 0.5), 700);
}

// === TIMER LOGIC ===
let phaseQueue = [];
let queueIndex = 0;

function buildQueue() {
  const w = getVal('warmup');
  const e = getVal('exercise');
  const r = getVal('rest');
  const s = getVal('sets');
  const st = getVal('stretch');
  totalSets = s;

  const q = [];
  if (w > 0) q.push({ phase: 'warmup', duration: w, set: 0 });
  for (let i = 1; i <= s; i++) {
    q.push({ phase: 'exercise', duration: e, set: i });
    if (i < s && r > 0) q.push({ phase: 'rest', duration: r, set: i });
  }
  if (st > 0) q.push({ phase: 'stretch', duration: st, set: 0 });
  return q;
}

function startTimer() {
  phaseQueue = buildQueue();
  queueIndex = 0;
  currentSet = 1;

  if (phaseQueue.length === 0) return;

  resetLogState();
  btnState(true);
  runPhase(phaseQueue[0]);
}

function runPhase(item) {
  if (!item) { endWorkout(); return; }
  currentPhase = item.phase;
  currentSet = item.set;
  remaining = item.duration;

  beepPhaseChange();
  setPhaseUI(item.phase, remaining, item.set, totalSets);
  updateLogCardForPhase(item);
  clearInterval(timer);

  timer = setInterval(() => {
    if (isPaused) return;
    remaining--;

    if (remaining <= 3 && remaining > 0) beepCountdown();

    setPhaseUI(item.phase, remaining, item.set, totalSets);

    if (remaining <= 0) {
      clearInterval(timer);
      queueIndex++;
      if (queueIndex < phaseQueue.length) {
        runPhase(phaseQueue[queueIndex]);
      } else {
        endWorkout();
      }
    }
  }, 1000);
}

function endWorkout() {
  clearInterval(timer);
  currentPhase = 'done';
  beepDone();
  setPhaseUI('done', 0, totalSets, totalSets);
  document.getElementById('timerDisplay').textContent = '완료!';
  btnState(false);
  document.getElementById('btnStart').textContent = '▶ 다시 시작';
  document.getElementById('btnStart').disabled = false;
  showLogCard(totalSets, { final: true });
  renderLogSummary();
  createHistoryEntry();
}

function pauseTimer() {
  isPaused = true;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('btnResume').disabled = false;
  document.getElementById('phaseLabel').classList.add('pulsing');
}

function resumeTimer() {
  isPaused = false;
  document.getElementById('btnPause').disabled = false;
  document.getElementById('btnResume').disabled = true;
  document.getElementById('phaseLabel').classList.remove('pulsing');
}

function stopTimer() {
  if (currentPhase && currentPhase !== 'done' && hasAnyLog()) {
    const wantsSave = confirm('운동을 중간에 정지합니다.\n지금까지 기록한 세트 기록을 저장하시겠습니까?');
    if (wantsSave) createHistoryEntry({ completed: false });
  }
  clearInterval(timer);
  isPaused = false;
  currentPhase = null;
  document.getElementById('phaseLabel').classList.remove('pulsing');
  btnState(false);
  document.getElementById('btnStart').textContent = '▶ 시작';
  document.getElementById('btnStart').disabled = false;
  setPhaseUI('exercise', 0, 0, 0);
  document.getElementById('phaseLabel').textContent = '정지됨';
  document.getElementById('timerDisplay').textContent = '00:00';
  document.getElementById('nextPhase').textContent = '시작 버튼을 눌러 운동을 시작하세요';
  document.getElementById('setBadge').textContent = '대기 중';
  ['warmup','exercise','rest','stretch'].forEach(s => {
    document.getElementById('seg-'+s).classList.remove('active');
  });
  resetLogState();
}

function btnState(running) {
  document.getElementById('btnStart').disabled = running;
  document.getElementById('btnPause').disabled = !running;
  document.getElementById('btnResume').disabled = true;
  document.getElementById('btnStop').disabled = !running;
}

// === SAVE / LOAD ROUTINES ===
function getSavedRoutines() {
  try { return JSON.parse(localStorage.getItem('wt_routines') || '[]'); } catch { return []; }
}

function saveRoutine() {
  const routines = getSavedRoutines();
  const name = getStr('routineName') || '루틴 ' + (routines.length + 1);
  const data = {
    name,
    warmup: getVal('warmup'),
    exercise: getVal('exercise'),
    rest: getVal('rest'),
    sets: getVal('sets'),
    stretch: getVal('stretch'),
    savedAt: Date.now()
  };
  routines.unshift(data);
  if (routines.length > 20) routines.length = 20;
  localStorage.setItem('wt_routines', JSON.stringify(routines));
  renderRoutineList();
  alert(`"${name}" 루틴이 저장되었습니다!`);
}

function loadRoutine(idx) {
  const routines = getSavedRoutines();
  const r = routines[idx];
  if (!r) return;
  document.getElementById('routineName').value = r.name;
  document.getElementById('warmup').value = r.warmup;
  document.getElementById('exercise').value = r.exercise;
  document.getElementById('rest').value = r.rest;
  document.getElementById('sets').value = r.sets;
  document.getElementById('stretch').value = r.stretch;
  calcTotal();
  toggleRoutineList();
}

function deleteRoutine(idx) {
  const routines = getSavedRoutines();
  routines.splice(idx, 1);
  localStorage.setItem('wt_routines', JSON.stringify(routines));
  renderRoutineList();
}

function renderRoutineList() {
  const routines = getSavedRoutines();
  const el = document.getElementById('routineList');
  if (routines.length === 0) {
    el.innerHTML = '<div class="empty-msg">저장된 루틴이 없습니다</div>';
    return;
  }
  el.innerHTML = routines.map((r, i) => {
    const total = r.warmup + (r.exercise + r.rest) * r.sets - r.rest + r.stretch;
    return `<div class="routine-slot" onclick="loadRoutine(${i})">
      <div class="slot-name">${r.name}</div>
      <div class="slot-meta">${r.sets}세트 · ${formatTime(Math.max(0,total))}</div>
      <button class="slot-delete" onclick="event.stopPropagation();deleteRoutine(${i})">✕</button>
    </div>`;
  }).join('');
}

function toggleRoutineList() {
  const wrap = document.getElementById('routineListWrap');
  const isHidden = wrap.style.display === 'none';
  wrap.style.display = isHidden ? 'block' : 'none';
  if (isHidden) renderRoutineList();
}

// Init
calcTotal();
</script>
</body>
</html>
